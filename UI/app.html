<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BLOCKS — Mobile App Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14142B; --bg:#F6F5FB; --card:#fff; --line:#E7E5F2; --muted:#6B6A85; --soft:#F0EEFA;
  --brand:#5B3DF5; --brand-2:#EDE9FF; --brand-ink:#3A22C4;
  --d1:#0FA39A; --s1:#2F6BFF; --n1:#F08A00; --g1:#D6246E;
  --good:#12945A; --warn:#B7791F; --bad:#D92D3A;
  --r:18px; --font:'Plus Jakarta Sans','Noto Sans Devanagari',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:#E9E6F7;color:var(--ink);font-size:14px;line-height:1.4;display:flex;justify-content:center;align-items:center;gap:40px;padding:24px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg{display:block}

/* ---------- screen map (desktop only) ---------- */
.map{width:250px;align-self:stretch;max-height:820px;overflow:auto;padding-right:6px}
.map h1{font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;margin-bottom:4px}
.map p{color:var(--muted);font-size:12px;margin-bottom:16px}
.map h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.map button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:10px;font-weight:600;font-size:13px}
.map button:hover{background:#fff}
.map button.on{background:var(--ink);color:#fff}
.map a{display:block;margin-top:16px;padding:10px 12px;border-radius:12px;background:var(--brand);color:#fff;text-decoration:none;font-weight:700;font-size:13px;text-align:center}

/* ---------- phone ---------- */
.phone{width:390px;height:812px;background:var(--bg);border-radius:44px;box-shadow:0 0 0 10px #14142B,0 30px 80px rgba(20,20,43,.35);position:relative;overflow:hidden;display:flex;flex-direction:column;flex:none}
.status{height:34px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 26px 0;font-size:12px;font-weight:700}
.view{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.nav{flex:none;height:72px;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:0 8px 10px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);width:64px;padding:6px 0}
.nav button.on{color:var(--brand)}
.nav .plus{width:52px;height:40px;border-radius:14px;background:var(--ink);color:#fff;display:grid;place-items:center;margin-top:-2px}
.nav .plus svg{width:22px;height:22px}
.nav svg{width:24px;height:24px}

@media (max-width:900px){
  body{padding:0;display:block;background:var(--bg)}
  .map{display:none}
  .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}
  .status{display:none}
}

/* ---------- common ---------- */
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;position:sticky;top:0;background:rgba(246,245,251,.92);backdrop-filter:blur(10px);z-index:5}
.top h2{font-size:18px;font-weight:800;letter-spacing:-.01em;flex:1}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);position:relative;flex:none}
.ib svg{width:20px;height:20px}
.ib .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--g1);border:2px solid #fff}
.pad{padding:0 16px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.sm{font-size:12px}
.xs{font-size:11px}
.b{font-weight:700}
.eb{font-weight:800}
.h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.h3{font-size:16px;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;background:var(--brand);color:#fff;font-weight:700;width:100%}
.btn.dark{background:var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--brand-2);color:var(--brand-ink)}
.btn.sm{padding:8px 14px;width:auto;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{background:#FDECEE;color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:7px;font-size:11px;font-weight:700;background:var(--soft);color:var(--muted)}
.tag.good{background:#E3F6EC;color:var(--good)} .tag.warn{background:#FFF1D6;color:var(--warn)} .tag.bad{background:#FDECEE;color:var(--bad)} .tag.brand{background:var(--brand-2);color:var(--brand-ink)}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding:2px 16px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.field{display:block}
.field span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.input{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);outline:none}
.input:focus{border-color:var(--brand)}
textarea.input{resize:none;min-height:96px}
.sep{height:1px;background:var(--line);margin:12px 0}
.sw{width:46px;height:28px;border-radius:99px;background:#CFCBE6;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--brand)} .sw.on::after{left:21px}
.list>*{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.list>*:last-child{border-bottom:0}
.list .ico{width:38px;height:38px;border-radius:12px;background:var(--brand-2);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.list .ico svg{width:20px;height:20px}

/* avatar */
.av{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;font-size:15px}
.av.lg{width:84px;height:84px;border-radius:28px;font-size:30px}
.av.sm{width:32px;height:32px;border-radius:11px;font-size:12px}
.ring{padding:3px;border-radius:19px;background:conic-gradient(var(--d1),var(--s1),var(--n1),var(--g1),var(--d1));flex:none}
.ring .av{border:3px solid var(--bg)}

/* Reach Ladder: stepped blocks */
.lad{display:flex;align-items:flex-end;gap:3px}
.lad i{display:block;width:12px;border-radius:3px;background:#DAD7EC;position:relative;overflow:hidden}
.lad i:nth-child(1){height:9px}.lad i:nth-child(2){height:14px}.lad i:nth-child(3){height:19px}.lad i:nth-child(4){height:24px}
.lad i.f1{background:var(--d1)}.lad i.f2{background:var(--s1)}.lad i.f3{background:var(--n1)}.lad i.f4{background:var(--g1)}
.lad i.p::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--p);background:currentColor}
.lad.big i{width:46px}.lad.big{gap:6px}
.lad.big i:nth-child(1){height:34px}.lad.big i:nth-child(2){height:54px}.lad.big i:nth-child(3){height:74px}.lad.big i:nth-child(4){height:94px}
.lv{display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 6px;border-radius:99px;font-size:11px;font-weight:800;color:#fff}
.lv::before{content:"";width:8px;height:8px;border-radius:3px;background:rgba(255,255,255,.85)}
.lv.D1{background:var(--d1)}.lv.S1{background:var(--s1)}.lv.N1{background:var(--n1)}.lv.G1{background:var(--g1)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.c-D1{color:var(--d1)}.c-S1{color:var(--s1)}.c-N1{color:var(--n1)}.c-G1{color:var(--g1)}
.bg-D1{background:var(--d1)}.bg-S1{background:var(--s1)}.bg-N1{background:var(--n1)}.bg-G1{background:var(--g1)}

/* feed */
.post{background:var(--card);border-bottom:1px solid var(--line);padding:14px 0 6px}
.post .hd{display:flex;align-items:center;gap:10px;padding:0 16px 10px}
.post .name{font-weight:700;display:flex;align-items:center;gap:5px}
.media{margin:0 16px;border-radius:20px;height:360px;position:relative;overflow:hidden;color:#fff}
.media.photo{height:300px}
.media.textp{height:auto;min-height:150px;padding:20px;color:var(--ink);background:var(--soft)}
.media .pat{position:absolute;inset:0;opacity:.18;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:36px 36px}
.media .play{position:absolute;inset:0;display:grid;place-items:center}
.media .play span{width:60px;height:60px;border-radius:20px;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);display:grid;place-items:center}
.media .play svg{width:26px;height:26px}
.media .over{position:absolute;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;gap:8px}
.media .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.55));font-weight:600}
.pill{background:rgba(20,20,43,.55);backdrop-filter:blur(8px);color:#fff;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.acts{display:flex;align-items:center;gap:4px;padding:8px 10px 0}
.acts button{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:12px;font-weight:700;font-size:13px}
.acts svg{width:22px;height:22px}
.acts .on{color:var(--g1)}
.acts .sv.on{color:var(--brand)}
.climb{margin:10px 16px 8px;padding:10px 12px;border-radius:14px;background:var(--soft);display:flex;align-items:center;gap:12px;width:calc(100% - 32px);text-align:left}
.climb .t{font-size:12px;line-height:1.3}
.lbl{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px}
.lbl.original{background:#E3F6EC;color:#0B6B40}.lbl.report{background:#FFF1D6;color:#8A5A0B}.lbl.src{background:#E3EDFF;color:#1D4FC4}.lbl.pub{background:#E9E2FF;color:#4B2BD6}.lbl.ai{background:#FCE4F0;color:#A31756}.lbl.unv{background:#EEE;color:#555}.lbl.disp{background:#FDECEE;color:#B02030}
.lbl svg{width:12px;height:12px}

/* stories */
.stories{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 14px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600;width:66px;flex:none}
.story .av{width:56px;height:56px;border-radius:19px}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(20,20,43,.5);z-index:20;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{background:var(--card);width:100%;border-radius:26px 26px 0 0;padding:10px 18px 24px;max-height:82%;overflow:auto;animation:up .25s}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:#D5D2E8;margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:absolute;left:16px;right:16px;bottom:90px;z-index:30;background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-weight:600;font-size:13px;animation:up .25s}

/* ladder visuals */
.step{display:flex;gap:14px;position:relative;padding-bottom:18px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:17px;top:38px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step.done::before{background:currentColor}
.step .node{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--soft);color:var(--muted);flex:none}
.step.done .node,.step.now .node{color:#fff}
.step.now .node{box-shadow:0 0 0 5px rgba(91,61,245,.14)}
.step.lock{opacity:.7}

.seg{display:flex;background:var(--soft);padding:4px;border-radius:14px;gap:2px}
.seg button{flex:1;padding:8px;border-radius:11px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(20,20,43,.1)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.grid3 .t{aspect-ratio:3/4;border-radius:10px;position:relative;overflow:hidden}
.grid3 .t .lv{position:absolute;left:5px;bottom:5px;font-size:10px;padding:2px 7px 2px 5px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi .card{padding:12px}
.kpi b{font-size:22px;letter-spacing:-.02em;display:block;margin-top:2px}
.steps-dots{display:flex;gap:6px}
.steps-dots i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps-dots i.on{background:var(--brand)}
.opt{display:flex;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:16px;background:var(--card);width:100%;text-align:left;align-items:center}
.opt.on{border-color:var(--brand);background:var(--brand-2)}
.opt .ico{width:40px;height:40px;border-radius:13px;background:var(--soft);display:grid;place-items:center;flex:none}
.opt.on .ico{background:#fff;color:var(--brand)}
.otp{display:flex;gap:10px;justify-content:center}
.otp input{width:48px;height:56px;text-align:center;font-size:22px;font-weight:800;border-radius:14px;border:1.5px solid var(--line);background:#fff;outline:none}
.otp input:focus{border-color:var(--brand)}
.hero{background:var(--ink);color:#fff;border-radius:26px;padding:22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:36px;background:var(--brand);opacity:.55;transform:rotate(18deg)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.check:last-child{border:0}
.check .m{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff}
.check .m svg{width:16px;height:16px}
.check .m.ok{background:var(--good)}.check .m.no{background:var(--bad)}.check .m.wait{background:#C9C6DE}
.lrow{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.lrow:last-child{border:0}
.live-vid{height:430px;border-radius:0;background:linear-gradient(160deg,#2c1c6e,#7a1f5c 60%,#d6246e);position:relative;color:#fff}
.chat p{background:rgba(20,20,43,.45);padding:6px 10px;border-radius:12px;margin-top:6px;font-size:12.5px;width:fit-content;max-width:90%}
.sparkline{width:100%;height:80px}
</style>
</head>
<body>

<aside class="map" id="map"></aside>

<main class="phone" id="phone">
  <div class="status"><span>9:41</span><span>5G ▮▮▮ 86%</span></div>
  <div class="view" id="view"></div>
  <nav class="nav" id="nav"></nav>
  <div id="overlay"></div>
</main>

<script>
/* ===================== icons ===================== */
const P={
home:'<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',
rise:'<path d="M4 20V14M10 20V9M16 20V12M22 20V4"/><path d="M3 7l5-4 4 3 6-5" />',

share:'<path d="M4 12v7h16v-7M12 3v12M7 8l5-5 5 5"/>',
save:'<path d="M6 3h12v18l-6-4-6 4z"/>',

more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
check:'<path d="M5 12l5 5 9-10"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',
shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
pin:'<path d="M12 21s7-6 7-11a7 7 0 00-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
play:'<path d="M7 4l13 8-13 8z" fill="currentColor"/>',
video:'<rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 10l5-3v10l-5-3"/>',
image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M4 18l5-5 4 4 3-3 4 4"/>',
text:'<path d="M5 6h14M12 6v13M9 19h6"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
live:'<circle cx="12" cy="12" r="3"/><path d="M6.3 6.3a8 8 0 000 11.4M17.7 6.3a8 8 0 010 11.4M3.5 3.5a12 12 0 000 17M20.5 3.5a12 12 0 010 17"/>',
lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
flag:'<path d="M5 21V4h12l-2 4 2 4H5"/>',
block:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
rupee:'<path d="M7 5h11M7 9h11M7 5c6 0 6 8-1 8h-.5L14 20"/>',
eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
store:'<path d="M4 9l1-5h14l1 5M4 9v11h16V9M4 9a2.7 2.7 0 005.3 0 2.7 2.7 0 005.4 0A2.7 2.7 0 0020 9M10 20v-6h4v6"/>',
phone:'<path d="M5 3h4l2 5-2.5 1.5a11 11 0 006 6L16 13l5 2v4a2 2 0 01-2 2A16 16 0 013 5a2 2 0 012-2z"/>',
trend:'<path d="M3 17l6-6 4 4 8-9M15 6h6v6"/>',
tag:'<path d="M3 12V4h8l10 10-8 8zM7.5 7.5h.01"/>',
sparkle:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 17l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>',
help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 115 0c0 1.7-2.5 2-2.5 4M12 17h.01"/>',
doc:'<path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/>',
download:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',
snow:'<path d="M12 2v20M4 7l16 10M20 7L4 17"/>',

const $=s=>document.querySelector(s);
const ladder=(lv,prog,cls='')=>{
  const cur=LV[lv].i;let h='';
  for(let i=1;i<=4;i++){
    if(i<cur)h+=`<i class="f${i}"></i>`;
    else if(i===cur)h+=`<i class="f${i} ${prog<100?'p':''}" style="--p:${prog<100?prog:100}%;${prog<100?'background:#DAD7EC;':''}color:var(--${LV[lv].c})"></i>`;
    else h+='<i></i>';
  }
  return `<div class="lad ${cls}">${h}</div>`;
};
const lvPill=l=>`<span class="lv ${l}">${l} · ${LV[l].n}</span>`;
const av=(name,i,cls='')=>`<div class="av ${cls}" style="background:${COLORS[i%6]}">${name.split(' ').map(w=>w[0]).slice(0,2).join('')}</div>`;
const sw=(on,fn)=>`<button class="sw ${on?'on':''}" onclick="${fn}" aria-pressed="${on}"></button>`;
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;$('#phone').appendChild(e);setTimeout(()=>e.remove(),2200)}
function sheet(html){$('#overlay').innerHTML=`<div class="scrim" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="grab"></div>${html}</div></div>`}
function closeSheet(){$('#overlay').innerHTML=''}
const bar=(t,o={})=>`<div class="top">${o.noback?'':`<button class="ib" onclick="back()" aria-label="Back">${ic('back')}</button>`}<h2>${t}</h2>${o.right||''}</div>`;

function postCard(p,opts={}){
  const liked=S.liked.has(p.id),saved=S.saved.has(p.id);
  const nxt=NEXT[p.lv];
  const media=p.type==='text'
   ?`<div class="media textp"><div class="row" style="margin-bottom:10px">${lbl(p.label)}</div><div class="h3" style="line-height:1.35">${p.cap}</div><div class="sm muted" style="margin-top:12px">${ic('link',14)}${p.src||''}</div></div>`
   :`<div class="media ${p.type==='photo'?'photo':''}" style="background:${GR[p.g]}" onclick="go('journey',${p.id})"><div class="pat"></div>
      <div class="over"><span class="pill">${ic('pin',12)}${p.place.split(',')[0]}</span>${p.type==='video'?`<span class="pill">${p.dur}</span>`:''}</div>
      ${p.type==='video'?`<div class="play"><span>${ic('play')}</span></div>`:''}
      <div class="cap">${p.cap}<div class="xs" style="opacity:.85;margin-top:4px">${p.tags}</div></div></div>`;
  return `<article class="post">
   <div class="hd">
     <button onclick="go('profileView',${p.id})">${av(p.name,p.av)}</button>
     <div class="grow"><div class="name">${p.name}${badge(p.ver)}</div><div class="xs muted">@${p.handle} · ${p.place}</div></div>
     ${S.followed.has(p.id)?'':`<button class="btn soft sm" onclick="S.followed.add(${p.id});toast('Following @${p.handle}');render()">Follow</button>`}
     <button class="ib" style="width:32px;height:32px;border:0;background:none" onclick="reportSheet(${p.id})">${ic('more')}</button>
   </div>
   ${p.type==='text'?'':`<div style="padding:0 16px 8px;display:flex;gap:6px;flex-wrap:wrap">${lbl(p.label)}${p.biz?'<span class="lbl src">'+ic('store')+'Business</span>':''}</div>`}
   ${media}
   ${nxt||p.lv==='G1'?`<button class="climb" onclick="go('journey',${p.id})">
      ${ladder(p.lv,p.prog)}
      <div class="t grow">${nxt?`<b>${lvPill(p.lv).replace('lv ','lv ')}</b> <span class="muted">${p.prog}% to ${LV[nxt].n}</span><div class="muted">${p.cross||'Reach is growing'}</div>`:`${lvPill('G1')}<div class="muted" style="margin-top:2px">${p.cross||'Global reach'}</div>`}</div>
      <span class="muted">${ic('bars',20)}</span></button>`:''}
   <div class="acts">
     <button class="${liked?'on':''}" onclick="toggle('liked',${p.id})">${ic('heart')}${liked?'Liked':p.likes}</button>
     <button onclick="commentSheet(${p.id})">${ic('msg')}${p.cm}</button>
     <button onclick="shareSheet(${p.id})">${ic('share')}${p.sh}</button>
     <span class="grow"></span>
     <span class="xs muted" style="margin-right:4px">${ic('eye',14)}</span><span class="xs muted" style="margin-right:6px">${p.views}</span>
     <button class="sv ${saved?'on':''}" onclick="toggle('saved',${p.id})">${ic('save')}</button>
   </div>
  </article>`;
}
function toggle(k,id){S[k].has(id)?S[k].delete(id):S[k].add(id);if(k==='saved')toast(S.saved.has(id)?'Saved to your collection':'Removed from saved');render()}

SCREENS.campaign=()=>{

  if(st===1)body=`<div class="h3">Choose your audience</div><div style="display:flex;flex-wrap:wrap;gap:8px">${areaOpts.map(a=>`<button class="chip ${c.areas.has(a)?'on':''}" onclick="S.camp.areas.has('${a}')?S.camp.areas.delete('${a}'):S.camp.areas.add('${a}');render()">${a}</button>`).join('')}</div>

   <div class="card"><div class="xs muted b">ESTIMATED REACH</div><div class="eb" style="font-size:26px">${reachLo.toLocaleString()} – ${reachHi.toLocaleString()}</div><div class="xs muted">Targeting simulation · not a guarantee</div></div>`;
  if(st===2)body=`<div class="h3">Budget &amp; schedule</div>
   <div class="card stack"><div class="row between"><b>Daily budget</b><b>₹${c.budget}</b></div><input type="range" min="200" max="10000" step="100" value="${c.budget}" oninput="S.camp.budget=+this.value;render()" style="width:100%;accent-color:#5B3DF5">
   <div class="row between"><b>Duration</b><b>${c.days} days</b></div><input type="range" min="1" max="30" value="${c.days}" oninput="S.camp.days=+this.value;render()" style="width:100%;accent-color:#5B3DF5"></div>
   <div class="card"><div class="row between"><span class="muted">Total spend</span><b class="h3">₹${(c.budget*c.days).toLocaleString()}</b></div><div class="row between" style="margin-top:6px"><span class="muted">Est. reach</span><b>${reachLo.toLocaleString()}+</b></div></div>`;
  if(st===3)body=`<div class="h3">Review &amp; submit</div><div class="card">${[['Objective',c.obj],['Audience',[...c.areas].join(', ')||'—'],['Budget',`₹${c.budget}/day × ${c.days} days`],['Total',`₹${(c.budget*c.days).toLocaleString()}`],['Billing','Prepaid wallet']].map(r=>`<div class="lrow"><span class="muted">${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>

  return `${bar('New campaign')}
  <div class="pad stack"><div class="steps-dots">${[0,1,2,3].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>${body}
  <div class="row">${st>0?`<button class="btn ghost grow" onclick="S.camp.step--;render()">Back</button>`:''}<button class="btn grow" onclick="${st<3?'S.camp.step++;render()':"toast('Submitted for review (simulated)');S.camp.step=0;back()"}">${st<3?'Continue':'Submit for review'}</button></div></div>`;
};

  document.querySelectorAll('#map button').forEach(b=>b.classList.toggle('on',b.dataset.s===S.screen));

render();
