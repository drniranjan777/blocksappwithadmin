<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLOCKS — Admin & Compliance Console</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14142B;--bg:#F4F3FA;--card:#fff;--line:#E7E5F2;--muted:#6B6A85;--soft:#F0EEFA;--brand:#5B3DF5;--brand-2:#EDE9FF;--d1:#0FA39A;--s1:#2F6BFF;--n1:#F08A00;--g1:#D6246E;--good:#12945A;--warn:#B7791F;--bad:#D92D3A;--font:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.45;display:flex;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg{display:block;width:18px;height:18px}
aside{width:236px;background:var(--ink);color:#C9C7E3;padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex:none;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:17px;letter-spacing:-.02em;padding:2px 8px 18px}
.brand small{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;color:#8F8CB8}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:10px;font-weight:600;color:#C9C7E3;text-align:left}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button.on{background:var(--brand);color:#fff}
.nav .cnt{margin-left:auto;background:var(--g1);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.nav h6{font-size:10px;letter-spacing:.1em;color:#7F7CAA;margin:16px 10px 6px;text-transform:uppercase}
main{flex:1;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 28px;background:rgba(244,243,250,.9);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.topbar h1{font-size:20px;font-weight:800;letter-spacing:-.02em;flex:1}
.search{padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;width:260px;outline:none}
.role{padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700}
.content{padding:24px 28px 60px;max-width:1280px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h3{font-size:15px;font-weight:800;margin-bottom:4px}
.sub{color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:2fr 1fr}
.kpi .l{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:4px 0 2px}
.up{color:var(--good);font-weight:700;font-size:12px}.dn{color:var(--bad);font-weight:700;font-size:12px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:7px;font-size:11.5px;font-weight:700;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.good{background:#E3F6EC;color:var(--good)}.tag.warn{background:#FFF1D6;color:var(--warn)}.tag.bad{background:#FDECEE;color:var(--bad)}.tag.brand{background:var(--brand-2);color:#3A22C4}
.lv{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:800;color:#fff}
.lv.D1{background:var(--d1)}.lv.S1{background:var(--s1)}.lv.N1{background:var(--n1)}.lv.G1{background:var(--g1)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAF9FE}
.btn{padding:8px 14px;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:#FDECEE;color:var(--bad)}.btn.good{background:#E3F6EC;color:var(--good)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1}
.wrap{flex-wrap:wrap}
.av{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.input,.sel{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;outline:none}
.input:focus{border-color:var(--brand)}
.num{width:84px;text-align:right;font-weight:700}
.seg{display:inline-flex;background:var(--soft);padding:3px;border-radius:11px}
.seg button{padding:6px 12px;border-radius:9px;font-weight:700;font-size:12.5px;color:var(--muted)}.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:12.5px}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sw{width:40px;height:24px;border-radius:99px;background:#CFCBE6;position:relative;flex:none}.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--brand)}.sw.on::after{left:19px}
.note{padding:12px 14px;border-radius:12px;background:var(--brand-2);color:#3A22C4;font-size:12.5px;font-weight:600}
.note.warn{background:#FFF1D6;color:#7A4E0B}
.thumb{width:44px;height:58px;border-radius:9px;flex:none}
.drawer{position:fixed;right:0;top:0;bottom:0;width:420px;background:#fff;border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(20,20,43,.15);z-index:20;padding:24px;overflow:auto;animation:in .2s}
@keyframes in{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:40}
.sla{font-variant-numeric:tabular-nums;font-weight:700}
.sla.late{color:var(--bad)}
.funnel .r{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.funnel .r .n{width:96px;font-weight:700;font-size:12.5px}
.funnel .r .b{flex:1;height:30px;border-radius:9px;color:#fff;display:flex;align-items:center;padding:0 12px;font-weight:800}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
@media (max-width:1100px){.g4{grid-template-columns:1fr 1fr}.g21,.g3,.g2{grid-template-columns:1fr}aside{width:200px}}
@media (max-width:760px){body{display:block}aside{position:static;width:100%;height:auto}.content{padding:16px}.search{display:none}.drawer{width:100%}}
</style>
</head>
<body>
<aside><div class="brand" id="brand"></div><nav class="nav" id="nav"></nav></aside>
<main>
  <div class="topbar"><h1 id="title"></h1><input class="search" placeholder="Search users, posts, reports…"><select class="role" id="role" onchange="setRole(this.value)"></select><a href="app.html" class="btn ghost" style="text-decoration:none">Mobile app ↗</a></div>
  <div class="content" id="content"></div>
</main>
<div id="layer"></div>

<script>
const I={
dash:'<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.3-5 6.5-5s5.7 1.5 6.5 5M17 4.5a3.5 3.5 0 010 7"/>',
content:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 15l5-5 4 4 3-3 6 6"/>',
flag:'<path d="M5 21V4h12l-2 4 2 4H5"/>',
reach:'<path d="M4 20v-5M10 20v-9M16 20V8M22 20V3"/>',
money:'<path d="M7 5h11M7 9h11M7 5c6 0 6 8-1 8h-.5L14 20"/>',
ads:'<path d="M3 11v3l12 5V6zM15 9a4 4 0 010 6M6 14l1 5h3"/>',
store:'<path d="M4 9l1-5h14l1 5M4 9v11h16V9M4 9a2.7 2.7 0 005.3 0 2.7 2.7 0 005.4 0A2.7 2.7 0 0020 9"/>',
live:'<circle cx="12" cy="12" r="3"/><path d="M6.3 6.3a8 8 0 000 11.4M17.7 6.3a8 8 0 010 11.4"/>',
policy:'<path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/>',
audit:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M12 8v5M12 16h.01"/>',
verify:'<path d="M12 3l2.5 2 3.2-.3.9 3.1 2.7 1.8-1.1 3 1.1 3-2.7 1.8-.9 3.1-3.2-.3L12 21l-2.5-2-3.2.3-.9-3.1L2.7 14.4l1.1-3-1.1-3 2.7-1.8.9-3.1 3.2.3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const logo=s=>`<div style="width:${s}px;height:${s}px;border-radius:${s*.3}px;background:#2A2A55;display:flex;align-items:flex-end;justify-content:center;gap:${s*.07}px;padding:${s*.2}px"><i style="width:${s*.15}px;height:${s*.2}px;background:#0FA39A;border-radius:2px"></i><i style="width:${s*.15}px;height:${s*.34}px;background:#2F6BFF;border-radius:2px"></i><i style="width:${s*.15}px;height:${s*.48}px;background:#F08A00;border-radius:2px"></i><i style="width:${s*.15}px;height:${s*.6}px;background:#D6246E;border-radius:2px"></i></div>`;
const COL=['#5B3DF5','#0FA39A','#D6246E','#2F6BFF','#F08A00','#12945A'];
const GR=['linear-gradient(150deg,#ff7a45,#c2185b)','linear-gradient(150deg,#2f6bff,#6a1fd0)','linear-gradient(150deg,#0fa39a,#0b4f8a)','linear-gradient(150deg,#f5a623,#d6246e)','linear-gradient(150deg,#14142b,#5b3df5)'];
const av=(n,i)=>`<div class="av" style="background:${COL[i%6]}">${n.split(' ').map(w=>w[0]).slice(0,2).join('')}</div>`;

/* ---- RBAC: roles see only permitted modules ---- */
const MODS=[
 ['dash','Dashboard','dash',['admin','moderator','finance','support','business'],'Overview'],
 ['users','Users','users',['admin','support','moderator'],'Operate'],
 ['content','Content','content',['admin','moderator'],'Operate'],
 ['reports','Reports & appeals','flag',['admin','moderator','support'],'Operate'],
 ['live','Live safety','live',['admin','moderator'],'Operate'],
 ['reach','Reach engine','reach',['admin'],'Platform'],
 ['earnings','Earnings','money',['admin','finance'],'Platform'],
 ['ads','Ads','ads',['admin','business','finance'],'Platform'],
 ['business','Business & verification','store',['admin','business'],'Platform'],
 ['policy','Policy','policy',['admin','moderator'],'Govern'],
 ['audit','Audit logs','audit',['admin'],'Govern']];
const ROLES={admin:'Super Admin',moderator:'Moderator',finance:'Finance',support:'Support',business:'Business Ops'};
let role='admin',page='dash';

/* ---- data ---- */
const AUDIT=[
 ['08 Oct 14:22','Anjali (Moderator)','Removed post #48213','Reason: graphic violence · Ref R-1042'],
 ['08 Oct 13:58','Rohit (Finance)','Held payout batch CY12-B','Reason: fraud review on 14 accounts'],
 ['08 Oct 11:03','Super Admin','Changed live follower gate','5,000 → 5,000 (reviewed, unchanged)'],
 ['07 Oct 19:40','Kiran (Support)','Reset sessions for @vendor_hub','Suspicious login alert'],
 ['07 Oct 16:12','Anjali (Moderator)','Approved appeal A-311','Post restored · label Source-Linked']];
const REPORTS=[
 {id:'R-1051',post:'Waterlogging near Sindhi Camp',who:'@arjun.reports',reason:'Misinformation',sev:'Medium',sla:62,st:'open',g:4},
 {id:'R-1050',post:'Live: "Free cricket kit giveaway"',who:'@promo_king',reason:'Fraud / phishing link',sev:'High',sla:14,st:'open',g:3},
 {id:'R-1049',post:'Street fight outside college gate',who:'@campus.buzz',reason:'Graphic violence',sev:'High',sla:-8,st:'open',g:0},
 {id:'R-1048',post:'Meme: leader deepfake',who:'@rofl_india',reason:'Deceptive AI / deepfake',sev:'High',sla:35,st:'open',g:1},
 {id:'R-1047',post:'Match highlights 4K',who:'@sportzone',reason:'Copyright complaint',sev:'Low',sla:240,st:'open',g:2},
 {id:'R-1046',post:'Comment spam on 40 posts',who:'@earn_now_99',reason:'Fake engagement / bots',sev:'Medium',sla:120,st:'open',g:4}];
const USERS=[
 ['Riya Sharma','@riya.eats','Patna, BR','Creator',12400,'Low','Active'],
 ['Sai Footwear','@saifootwear','Hyderabad, TS','Business',6400,'Low','Verified'],
 ['Tanvi Nair','@tanvi.kochi','Kochi, KL','Trusted Creator',48000,'Low','Verified'],
 ['Earn Now 99','@earn_now_99','Unknown','Creator',210,'High','Restricted'],
 ['Arjun Singh','@arjun.reports','Jaipur, RJ','User',2100,'Medium','Active'],
 ['Promo King','@promo_king','Delhi, DL','Creator',8800,'High','Under review'],
 ['Meghdoot News','@meghdoot.news','Lucknow, UP','Publisher',96000,'Low','Verified'],
 ['Neha Prasad','@neha.prasad','Patna, BR','User',1800,'Low','Active']];
const CONTENT=[
 ['Litti chokha behind Gandhi Maidan','@riya.eats','Reel','D1','Original','Live',0],
 ['Kathakali make-up in 4 minutes','@tanvi.kochi','Reel','N1','Original','Live',2],
 ['Pune skyline as stacked blocks','@kabir.makes','Photo','G1','AI-Generated','Live',4],
 ['Gomti riverfront phase 2 inaugurated','@meghdoot.news','Text','N1','Verified Publisher','Live',1],
 ['Waterlogging near Sindhi Camp','@arjun.reports','Photo','D1','Community Report','Flagged',3],
 ['Free cricket kit giveaway (live)','@promo_king','Live','—','Unverified','Reviewing',0]];
const CAMPS=[
 ['Diwali kolhapuri offer','Sai Footwear','Local Campaign','₹14,000','Active','Approved'],
 ['Chai Sutta Corner grand opening','Chai Sutta Corner','Business Awareness','₹4,000','In review','Pending'],
 ['Win iPhone — click here','@promo_king','Website / Lead','₹25,000','Flagged','Policy: suspected phishing'],
 ['Boost: Pune art class','Kabir Makes','Boost Post','₹1,500','Active','Approved']];
const BIZ=[['Sai Footwear','Footwear · Hyderabad','Official Business','Approved'],['Chai Sutta Corner','Cafe · Patna','Official Business','Pending'],['Meghdoot News','News · Lucknow','Verified Publisher','Pending'],['Riya Sharma','Creator · Patna','Identity Verified','Pending']];
const SIGNALS=[['Qualified unique viewers',25],['Watch time / completion',25],['Shares / reposts',15],['Saves / meaningful actions',10],['Comments / conversations',10],['Audience geographic expansion',10],['Trust & originality',5]];
const CFG={w:SIGNALS.map(s=>s[1]),th:{S1:{districts:3,qrs:55},N1:{states:4,qrs:70},G1:{countries:5,qrs:85}},mult:{D1:1.0,S1:1.5,N1:2.5,G1:4.0},
 live:{followers:5000,age:30,twofa:true,age18:true,trust:60}};

/* ---- shell ---- */
function setRole(r){role=r;if(!MODS.find(m=>m[0]===page&&m[3].includes(r)))page=MODS.find(m=>m[3].includes(r))[0];paint()}
function nav(p){page=p;paint()}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function logAudit(a,d){const n=new Date();AUDIT.unshift([`${n.getDate()} Oct ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`,ROLES[role],a,d])}
function drawer(h){document.getElementById('layer').innerHTML=`<div class="drawer"><button class="btn ghost sm" onclick="closeD()" style="float:right">Close ✕</button>${h}</div>`}
function closeD(){document.getElementById('layer').innerHTML=''}

function paint(){
  document.getElementById('brand').innerHTML=`${logo(34)}<div>BLOCKS<small>ADMIN CONSOLE</small></div>`;
  document.getElementById('role').innerHTML=Object.entries(ROLES).map(r=>`<option value="${r[0]}" ${r[0]===role?'selected':''}>${r[1]}</option>`).join('');
  const mods=MODS.filter(m=>m[3].includes(role));let last='';
  document.getElementById('nav').innerHTML=mods.map(m=>{const h=m[4]!==last?`<h6>${m[4]}</h6>`:'';last=m[4];const c=m[0]==='reports'?`<span class="cnt">${REPORTS.filter(r=>r.st==='open').length}</span>`:'';return h+`<button class="${page===m[0]?'on':''}" onclick="nav('${m[0]}')">${ic(m[2])}${m[1]}${c}</button>`}).join('')+`<div style="margin:18px 10px 0;font-size:11.5px;color:#8F8CB8">Signed in as <b style="color:#fff">${ROLES[role]}</b><br>2FA enforced · session 14 min</div>`;
  document.getElementById('title').textContent=MODS.find(m=>m[0]===page)[1];
  document.getElementById('content').innerHTML=PAGES[page]();
  closeD();
}

/* ---- charts ---- */
function line(pts,color='#5B3DF5',h=140){
  const max=Math.max(...pts)*1.1,w=600,st=w/(pts.length-1);
  const d=pts.map((v,i)=>`${i?'L':'M'}${(i*st).toFixed(1)} ${(h-v/max*h).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px"><defs><linearGradient id="lg${color.slice(1)}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".25"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w} ${h} L0 ${h}Z" fill="url(#lg${color.slice(1)})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
const kpi=(l,v,d,up=true)=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="${up?'up':'dn'}">${up?'▲':'▼'} ${d}</div></div>`;

/* ---- pages ---- */
const PAGES={};
PAGES.dash=()=>`
<div class="grid g4">${kpi('DAU','48,210','8.2% wk')}${kpi('Uploads / day','12,940','5.1% wk')}${kpi('Open reports',''+REPORTS.filter(r=>r.st==='open').length,'median 47 min',false)}${kpi('Ad revenue (MTD)','₹18.4L','12% mo')}</div>
<div class="grid g21" style="margin-top:16px">
  <div class="card"><div class="row between"><div><h3>Daily active users</h3><div class="sub">Last 30 days · beta districts</div></div><div class="seg"><button>7d</button><button class="on">30d</button></div></div>${line([22,24,23,27,30,29,33,35,34,38,40,39,42,41,44,46,45,47,43,46,48,49,47,50,52,51,54,53,56,58])}</div>
  <div class="card funnel"><h3>Reach Ladder conversion</h3><div class="sub" style="margin-bottom:14px">Share of posts reaching each level (7d)</div>
    ${[['D1 District','100%','#0FA39A',100],['S1 State','14.2%','#2F6BFF',72],['N1 National','2.1%','#F08A00',44],['G1 Global','0.3%','#D6246E',26]].map(f=>`<div class="r"><div class="n">${f[0]}</div><div class="b" style="width:${f[3]}%;background:${f[2]}">${f[1]}</div></div>`).join('')}</div>
</div>
<div class="grid g3" style="margin-top:16px">
  <div class="card"><h3>Trust & safety</h3><div class="sub" style="margin-bottom:10px">Last 7 days</div>${[['Reports / 1k users','3.4'],['Action rate','61%'],['Median time-to-action','47 min'],['Appeal overturn rate','9%'],['Repeat offender rate','4.2%']].map(r=>`<div class="row between" style="padding:7px 0;border-bottom:1px solid var(--line)"><span class="sub">${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>
  <div class="card"><h3>Creator economy</h3><div class="sub" style="margin-bottom:10px">Cycle 12</div>${[['Reward pool','₹6.2L'],['Estimated earnings','₹4.9L'],['Finalised','₹3.1L'],['Payout holds','14 accounts'],['Monetised creators','1,820']].map(r=>`<div class="row between" style="padding:7px 0;border-bottom:1px solid var(--line)"><span class="sub">${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>
  <div class="card"><h3>Needs attention</h3><div class="sub" style="margin-bottom:10px">Highest priority first</div>
    <div class="note warn" style="margin-bottom:8px">1 report past SLA · R-1049 graphic violence</div>
    <div class="note warn" style="margin-bottom:8px">2 campaigns flagged by policy</div>
    <div class="note">3 verification applications waiting</div></div>
</div>`;

/* users */
let uq='';
PAGES.users=()=>`
<div class="row between wrap" style="margin-bottom:14px"><div class="tabs" style="margin:0">${['All','Creators','Business','High risk','Restricted'].map((t,i)=>`<button class="chip ${i===0?'on':''}">${t}</button>`).join('')}</div><div class="row"><input class="input" placeholder="Filter users…" oninput="uq=this.value.toLowerCase();document.getElementById('utb').innerHTML=userRows()"></div></div>
<div class="card" style="padding:4px 8px"><table><thead><tr><th>User</th><th>Location</th><th>Type</th><th>Followers</th><th>Risk</th><th>Status</th><th></th></tr></thead><tbody id="utb">${userRows()}</tbody></table></div>
<p class="sub" style="margin-top:10px">Risk is shown to staff only. Users see a simplified reputation status, never the internal Trust Score. Enforcement is tied to published rules.</p>`;
function userRows(){return USERS.map((u,i)=>[u,i]).filter(([u])=>!uq||(u[0]+u[1]).toLowerCase().includes(uq)).map(([u,i])=>`<tr><td><div class="row">${av(u[0],i)}<div><b>${u[0]}</b><div class="sub">${u[1]}</div></div></div></td><td>${u[2]}</td><td>${u[3]}</td><td>${u[4].toLocaleString()}</td><td><span class="tag ${u[5]==='High'?'bad':u[5]==='Medium'?'warn':'good'}">${u[5]}</span></td><td><span class="tag ${u[6]==='Verified'||u[6]==='Active'?'good':u[6]==='Restricted'?'bad':'warn'}">${u[6]}</span></td><td><button class="btn ghost sm" onclick="userD(${i})">Open</button></td></tr>`).join('')}
function userD(i){const u=USERS[i];drawer(`<div class="row" style="margin:26px 0 16px;gap:14px">${av(u[0],i)}<div><h3 style="font-size:18px">${u[0]}</h3><div class="sub">${u[1]} · ${u[2]}</div></div></div>
 <div class="grid g2" style="gap:10px;margin-bottom:14px"><div class="card kpi" style="padding:12px"><div class="l">Account age</div><div class="v" style="font-size:20px">212 days</div></div><div class="card kpi" style="padding:12px"><div class="l">Risk</div><div class="v" style="font-size:20px">${u[5]}</div></div></div>
 <div class="card" style="margin-bottom:14px"><h3>Signals</h3>${[['Verified contact',1],['2FA enabled',i%2===0],['Duplicate-content flags',i!==3],['Bot / device / IP risk',u[5]!=='High'],['Confirmed violations',u[5]==='Low']].map(s=>`<div class="row between" style="padding:6px 0"><span class="sub">${s[0]}</span><span class="tag ${s[1]?'good':'bad'}">${s[1]?'OK':'Flag'}</span></div>`).join('')}</div>
 <div class="card" style="margin-bottom:14px"><h3>Sessions & devices</h3><div class="sub">Android · Patna · 2 min ago<br>Web · Patna · 3 days ago</div><button class="btn ghost sm" style="margin-top:8px" onclick="logAudit('Reset sessions for ${u[1]}','Admin action');toast('Sessions revoked · logged to audit')">Revoke all sessions</button></div>
 <div class="row wrap"><button class="btn good" onclick="logAudit('Verified ${u[1]}','Identity check passed');toast('Verified · logged to audit')">Verify</button><button class="btn ghost" onclick="logAudit('Restricted ${u[1]}','Temporary restriction');toast('Restricted · logged to audit')">Restrict</button><button class="btn bad" onclick="logAudit('Suspended ${u[1]}','Policy violation');toast('Suspended · logged to audit')">Suspend</button></div>
 <p class="sub" style="margin-top:12px">Every action is recorded in the immutable audit log with your role and reason.</p>`)}

/* content */
PAGES.content=()=>`
<div class="tabs">${['All','Flagged','Reviewing','Labelled','Removed'].map((t,i)=>`<button class="chip ${i===0?'on':''}">${t}</button>`).join('')}</div>
<div class="card" style="padding:4px 8px"><table><thead><tr><th>Post</th><th>Type</th><th>Reach</th><th>Label</th><th>Status</th><th></th></tr></thead><tbody>${CONTENT.map((c,i)=>`<tr><td><div class="row"><div class="thumb" style="background:${GR[c[6]%5]}"></div><div><b>${c[0]}</b><div class="sub">${c[1]}</div></div></div></td><td>${c[2]}</td><td>${c[3]==='—'?'—':`<span class="lv ${c[3]}">${c[3]}</span>`}</td><td><span class="tag brand">${c[4]}</span></td><td><span class="tag ${c[5]==='Live'?'good':'warn'}">${c[5]}</span></td><td><div class="row"><button class="btn ghost sm" onclick="logAudit('Labelled post','${c[0].replace(/'/g,'')}');toast('Label updated · logged')">Label</button><button class="btn bad sm" onclick="logAudit('Removed post','${c[0].replace(/'/g,'')}');toast('Removed · evidence preserved · logged')">Remove</button></div></td></tr>`).join('')}</tbody></table></div>`;

/* reports */
PAGES.reports=()=>`
<div class="grid g4" style="margin-bottom:16px">${kpi('Open','' +REPORTS.filter(r=>r.st==='open').length,'queue',false)}${kpi('Past SLA',''+REPORTS.filter(r=>r.st==='open'&&r.sla<0).length,'needs action now',false)}${kpi('Median TTA','47 min','6 min faster')}${kpi('Appeals pending','7','2 new today',false)}</div>
<div class="tabs"><button class="chip on">Reports</button><button class="chip">Appeals (7)</button><button class="chip">Resolved</button></div>
<div class="card" style="padding:4px 8px"><table><thead><tr><th>ID</th><th>Content</th><th>Reason</th><th>Severity</th><th>SLA</th><th>Action</th></tr></thead><tbody>${REPORTS.map((r,i)=>`<tr><td class="mono">${r.id}</td><td><div class="row"><div class="thumb" style="background:${GR[r.g]};width:36px;height:46px"></div><div><b>${r.post}</b><div class="sub">${r.who}</div></div></div></td><td>${r.reason}</td><td><span class="tag ${r.sev==='High'?'bad':r.sev==='Medium'?'warn':''}">${r.sev}</span></td><td><span class="sla ${r.sla<0?'late':''}">${r.st!=='open'?'—':r.sla<0?`${-r.sla}m overdue`:r.sla>=60?`${Math.floor(r.sla/60)}h ${r.sla%60}m`:`${r.sla}m`}</span></td><td>${r.st==='open'?`<div class="row"><button class="btn bad sm" onclick="act(${i},'Removed')">Remove</button><button class="btn ghost sm" onclick="act(${i},'Labelled')">Label</button><button class="btn ghost sm" onclick="act(${i},'Dismissed')">Dismiss</button></div>`:`<span class="tag good">${r.st}</span>`}</td></tr>`).join('')}</tbody></table></div>
<p class="sub" style="margin-top:10px">Child-safety reports are escalated immediately and bypass this queue. Every decision can be appealed by the creator.</p>`;
function act(i,a){const r=REPORTS[i];r.st=a;logAudit(`${a}: ${r.post}`,`Report ${r.id} · ${r.reason}`);toast(`${r.id} ${a.toLowerCase()} · logged to audit`);paint()}

/* reach engine */
PAGES.reach=()=>{
  const sum=CFG.w.reduce((a,b)=>a+b,0);
  return `<div class="note" style="margin-bottom:16px">All weights and thresholds are configurable here and are never hard-coded into the mobile or web client. Changes are versioned and audited.</div>
<div class="grid g2">
 <div class="card"><div class="row between"><div><h3>Qualified Reach Score weights</h3><div class="sub">Illustrative starting values — tune with controlled experiments</div></div><span class="tag ${sum===100?'good':'bad'}" id="wsum">Total ${sum}%</span></div>
  <div style="margin-top:14px">${SIGNALS.map((s,i)=>`<div style="margin-bottom:14px"><div class="row between"><b>${s[0]}</b><div class="row" style="gap:6px"><input type="number" class="input num" min="0" max="100" value="${CFG.w[i]}" oninput="setW(${i},this.value)"><span>%</span></div></div><div class="bar" style="margin-top:6px"><i id="wb${i}" style="width:${CFG.w[i]*2.5}%"></i></div></div>`).join('')}</div>
  <div class="row"><button class="btn" id="wsave" ${sum===100?'':'disabled'} onclick="logAudit('Updated QRS weights','${'Weights: '}'+CFG.w.join('/'));toast('Saved as v14 · logged to audit')">Save new version</button><button class="btn ghost" onclick="CFG.w=SIGNALS.map(s=>s[1]);paint()">Reset</button></div></div>
 <div class="grid" style="align-content:start">
  <div class="card"><h3>Level thresholds</h3><div class="sub" style="margin-bottom:10px">Minimum conditions to promote a post</div>
   <table><thead><tr><th>Level</th><th>Spread</th><th>Min QRS</th><th>Reward ×</th></tr></thead><tbody>
    <tr><td><span class="lv D1">D1</span></td><td class="sub">Entry level</td><td>—</td><td><input class="input num" value="${CFG.mult.D1}"></td></tr>
    <tr><td><span class="lv S1">S1</span></td><td><input class="input num" value="${CFG.th.S1.districts}" style="width:56px"> districts</td><td><input class="input num" value="${CFG.th.S1.qrs}" style="width:56px"></td><td><input class="input num" value="${CFG.mult.S1}"></td></tr>
    <tr><td><span class="lv N1">N1</span></td><td><input class="input num" value="${CFG.th.N1.states}" style="width:56px"> states</td><td><input class="input num" value="${CFG.th.N1.qrs}" style="width:56px"></td><td><input class="input num" value="${CFG.mult.N1}"></td></tr>
    <tr><td><span class="lv G1">G1</span></td><td><input class="input num" value="${CFG.th.G1.countries}" style="width:56px"> countries</td><td><input class="input num" value="${CFG.th.G1.qrs}" style="width:56px"></td><td><input class="input num" value="${CFG.mult.G1}"></td></tr></tbody></table>
   <button class="btn" style="margin-top:12px" onclick="logAudit('Updated Reach thresholds','S1/N1/G1 thresholds & multipliers');toast('Thresholds saved · logged')">Save thresholds</button></div>
  <div class="card"><h3>Anti-manipulation</h3>${[['Repeated-view suppression',1],['Device / account velocity limits',1],['Coordinated like & share detection',1],['Auto payout hold on suspicious activity',1],['Human review for high-value reward events',1]].map(t=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${t[0]}</span><button class="sw on" onclick="this.classList.toggle('on')"></button></div>`).join('')}</div>
 </div></div>`};
function setW(i,v){CFG.w[i]=Math.max(0,Math.min(100,+v||0));const s=CFG.w.reduce((a,b)=>a+b,0);const t=document.getElementById('wsum');t.textContent='Total '+s+'%';t.className='tag '+(s===100?'good':'bad');document.getElementById('wsave').disabled=s!==100;document.getElementById('wb'+i).style.width=CFG.w[i]*2.5+'%'}

/* earnings */
PAGES.earnings=()=>`
<div class="grid g4">${kpi('Reward pool · Cycle 12','₹6.2L','funded by ad revenue')}${kpi('Estimated','₹4.9L','may change after checks',false)}${kpi('Finalised','₹3.1L','63% of estimate')}${kpi('On hold','₹38K','14 accounts',false)}</div>
<div class="grid g21" style="margin-top:16px">
 <div class="card" style="padding:12px 8px"><div style="padding:0 10px"><h3>Payout exceptions</h3><div class="sub">Accounts held for fraud, copyright or KYC issues</div></div><table><thead><tr><th>Creator</th><th>Amount</th><th>Reason</th><th></th></tr></thead><tbody>
  ${[['@earn_now_99','₹12,400','Suspected view farming'],['@promo_king','₹8,800','Coordinated engagement'],['@sportzone','₹5,200','Copyright complaint'],['@vlog_zone','₹3,100','KYC mismatch']].map((r,i)=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td><span class="tag warn">${r[2]}</span></td><td><div class="row"><button class="btn good sm" onclick="logAudit('Released payout ${r[0]}','${r[1]}');toast('Released · logged')">Release</button><button class="btn bad sm" onclick="logAudit('Cancelled payout ${r[0]}','${r[1]}');toast('Cancelled · logged')">Cancel</button></div></td></tr>`).join('')}</tbody></table></div>
 <div class="card"><h3>Payout settings</h3><div class="sub" style="margin-bottom:12px">Revenue-share is disclosed in the Creator Earnings Policy</div>
  <label class="sub">Minimum payout threshold</label><input class="input" value="₹500" style="width:100%;margin:4px 0 12px">
  <label class="sub">Creator share of ad revenue</label><input class="input" value="45%" style="width:100%;margin:4px 0 12px">
  <label class="sub">Minimum account age</label><input class="input" value="90 days" style="width:100%;margin:4px 0 12px">
  <div class="note">KYC, PAN, bank and UPI data are stored in an isolated service with separate access controls.</div></div></div>`;

/* ads */
PAGES.ads=()=>`
<div class="grid g4">${kpi('Active campaigns','312','18 this week')}${kpi('Spend (MTD)','₹18.4L','12% mo')}${kpi('Avg. ROAS','3.1×','0.4 up')}${kpi('Policy flags','2','needs review',false)}</div>
<div class="card" style="margin-top:16px;padding:12px 8px"><div style="padding:0 10px"><h3>Campaign review queue</h3></div><table><thead><tr><th>Campaign</th><th>Advertiser</th><th>Objective</th><th>Budget</th><th>Status</th><th></th></tr></thead><tbody>${CAMPS.map((c,i)=>`<tr><td><b>${c[0]}</b></td><td>${c[1]}</td><td>${c[2]}</td><td>${c[3]}</td><td><span class="tag ${c[4]==='Active'?'good':c[4]==='Flagged'?'bad':'warn'}">${c[4]}</span>${c[4]==='Flagged'?`<div class="xs sub" style="font-size:11px">${c[5]}</div>`:''}</td><td><div class="row"><button class="btn good sm" onclick="logAudit('Approved campaign','${c[0]}');toast('Approved')">Approve</button><button class="btn bad sm" onclick="logAudit('Rejected campaign','${c[0]}');toast('Rejected')">Reject</button></div></td></tr>`).join('')}</tbody></table></div>
<div class="note" style="margin-top:14px">Targeting uses privacy-preserving cohorts only. Advertisers never see sensitive personal attributes.</div>`;

/* business + verification */
PAGES.business=()=>`
<div class="tabs"><button class="chip on">Verification queue</button><button class="chip">Business pages</button><button class="chip">Ads eligibility</button></div>
<div class="card" style="padding:4px 8px"><table><thead><tr><th>Applicant</th><th>Category</th><th>Badge</th><th>Status</th><th></th></tr></thead><tbody>${BIZ.map((b,i)=>`<tr><td><div class="row">${av(b[0],i)}<b>${b[0]}</b></div></td><td>${b[1]}</td><td><span class="tag brand">${b[2]}</span></td><td><span class="tag ${b[3]==='Approved'?'good':'warn'}">${b[3]}</span></td><td>${b[3]==='Approved'?'<button class="btn ghost sm" onclick="toast(\'Revocation requires written reason\')">Revoke</button>':`<div class="row"><button class="btn good sm" onclick="BIZ[${i}][3]='Approved';logAudit('Approved verification','${b[0]} · ${b[2]}');toast('Approved · logged');paint()">Approve</button><button class="btn bad sm" onclick="BIZ[${i}][3]='Rejected';logAudit('Rejected verification','${b[0]}');toast('Rejected · logged');paint()">Reject</button></div>`}</td></tr>`).join('')}</tbody></table></div>
<div class="note warn" style="margin-top:14px">Identity badges are never sold. Every badge has eligibility criteria and a documented revocation process.</div>`;

/* live */
PAGES.live=()=>`
<div class="grid g2">
 <div class="card"><h3>Live eligibility gate</h3><div class="sub" style="margin-bottom:14px">Defaults for controlled beta · all configurable</div>
  <div class="row between" style="padding:8px 0"><span>Minimum followers</span><input class="input num" value="${CFG.live.followers}"></div>
  <div class="row between" style="padding:8px 0"><span>Minimum account age (days)</span><input class="input num" value="${CFG.live.age}"></div>
  <div class="row between" style="padding:8px 0"><span>Minimum Trust Score</span><input class="input num" value="${CFG.live.trust}"></div>
  <div class="row between" style="padding:8px 0"><span>2FA required</span><button class="sw on" onclick="this.classList.toggle('on')"></button></div>
  <div class="row between" style="padding:8px 0"><span>18+ for unrestricted live</span><button class="sw on" onclick="this.classList.toggle('on')"></button></div>
  <div class="row between" style="padding:8px 0"><span>No active major violations</span><button class="sw on" onclick="this.classList.toggle('on')"></button></div>
  <div class="row between" style="padding:8px 0"><span>Disable live for high-risk categories</span><button class="sw" onclick="this.classList.toggle('on')"></button></div>
  <button class="btn" style="margin-top:10px" onclick="logAudit('Updated live gate','followers/age/trust');toast('Saved · logged')">Save gate</button></div>
 <div class="card"><h3>Live sessions now</h3><div class="sub" style="margin-bottom:10px">Automated audio/video risk detection with human escalation</div>
  ${[['@food.with.riya','Street food tour','1.2K','Clear','good'],['@promo_king','Free cricket kit giveaway','640','Risk: scam link','bad'],['@tanvi.kochi','Kathakali Q&A','3.8K','Clear','good']].map((l,i)=>`<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="grow"><b>${l[0]}</b><div class="sub">${l[1]} · ${l[2]} viewers</div></div><span class="tag ${l[4]}">${l[3]}</span><button class="btn bad sm" onclick="logAudit('Ended live ${l[0]}','Evidence preserved');toast('Stream ended · evidence preserved')">End live</button></div>`).join('')}
  <div class="note" style="margin-top:12px">Emergency controls: instant end-live, freeze comments, restrict account, evidence preservation.</div></div>
</div>
<div class="card" style="margin-top:16px;padding:12px 8px"><div style="padding:0 10px"><h3>Incident log</h3></div><table><thead><tr><th>Time</th><th>Account</th><th>Incident</th><th>Action</th></tr></thead><tbody><tr><td>07 Oct 21:14</td><td>@vlog_zone</td><td>Graphic violence detected</td><td><span class="tag bad">Stream ended · restricted 7d</span></td></tr><tr><td>06 Oct 18:02</td><td>@night.talks</td><td>Self-harm language — escalated to safety team</td><td><span class="tag warn">Interrupted · resources shown</span></td></tr></tbody></table></div>`;

/* policy */
PAGES.policy=()=>`
<div class="grid g2">
 <div class="card"><h3>Prohibited / restricted content</h3><div class="sub" style="margin-bottom:10px">Product rules — legal text to be reviewed by Indian counsel</div>
  ${[['Non-consensual & explicit sexual exploitation','Prohibited'],['Sexual content involving minors','Zero tolerance'],['Graphic gore & extreme violence','Prohibited'],['Self-harm / suicide promotion','Prohibited'],['Credible threats & violent incitement','Prohibited'],['Doxxing & sensitive personal info','Prohibited'],['Fraud, phishing, impersonation','Prohibited'],['Illegal goods & services','Prohibited'],['Fake engagement & botting','Prohibited'],['Deceptive deepfakes','Prohibited'],['News & current affairs','Restricted · labels'],['AI-generated content','Disclosure required']].map(p=>`<div class="row between" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>${p[0]}</span><span class="tag ${p[1]==='Zero tolerance'?'bad':p[1].startsWith('Prohibited')?'warn':'brand'}">${p[1]}</span></div>`).join('')}</div>
 <div class="grid" style="align-content:start"><div class="card"><h3>Content labels</h3><div class="sub" style="margin-bottom:10px">A post never gets "Verified News" because of views alone</div><div class="row wrap">${['Original Post','Community Report','Unverified','Source-Linked','Verified Publisher','Corrected / Disputed','AI-Generated'].map(l=>`<span class="tag brand">${l}</span>`).join('')}</div></div>
 <div class="card"><h3>Policy documents</h3>${[['Community Guidelines','v3.2 · draft'],['Creator Earnings Policy','v1.4 · draft'],['Privacy Policy','v1.0 · in legal review'],['Advertising Policy','v2.0 · draft']].map(d=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${d[0]}</b><span class="tag warn">${d[1]}</span></div>`).join('')}</div>
 <div class="note warn">Trust Score must never be used for political or viewpoint discrimination. Enforcement ties to published rules and documented violations.</div></div>
</div>`;

/* audit */
PAGES.audit=()=>`<div class="note" style="margin-bottom:14px">Append-only log of privileged actions. Entries can't be edited or deleted from this console. Actions you take in this prototype appear here.</div>
<div class="card" style="padding:4px 8px"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Detail</th></tr></thead><tbody>${AUDIT.map(a=>`<tr><td class="mono">${a[0]}</td><td><b>${a[1]}</b></td><td>${a[2]}</td><td class="sub">${a[3]}</td></tr>`).join('')}</tbody></table></div>`;

paint();
</script>
</body>
</html>
